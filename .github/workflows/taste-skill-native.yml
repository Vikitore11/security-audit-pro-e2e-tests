name: Taste Skill - original Node and Chrome smoke test

on:
  push:
    branches:
      - experiment/taste-native-ci
    paths:
      - .github/workflows/taste-skill-native.yml
      - taste-native/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taste-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    name: Pinned original Taste Skill gate in headless Chrome
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TASTE_PINNED_COMMIT: f6b76575f949707b4e3c37cd86cb44b0b98643e8
      TASTE_SKILL_TMP: /tmp/taste-native
      CI: "true"
    steps:
      - name: Checkout isolated public runner branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Verify original runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          google-chrome --version
          node -e "if(Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
          test -n "$(command -v google-chrome)"

      - name: Checkout original Taste Skill at immutable commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Leonxlnx/taste-skill.git taste-native/upstream
          git -C taste-native/upstream checkout --detach "$TASTE_PINNED_COMMIT"
          test "$(git -C taste-native/upstream rev-parse HEAD)" = "$TASTE_PINNED_COMMIT"
          test -f taste-native/upstream/skills/taste-skill/scripts/gate.mjs
          test -f taste-native/upstream/skills/taste-skill/scripts/consistency.mjs
          test -f taste-native/upstream/skills/taste-skill/scripts/copy-lint.mjs
          test -f taste-native/upstream/skills/taste-skill/assets/layout/check.mjs

      - name: Run original copy lint on intentionally flawed fixture
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node taste-native/upstream/skills/taste-skill/scripts/copy-lint.mjs taste-native/fixtures/index.html --kind software --json > taste-native/copy-lint.json 2> taste-native/copy-lint.err
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            cat taste-native/copy-lint.err
            exit "$code"
          fi
          node -e "const r=require('./taste-native/copy-lint.json'); if(!Array.isArray(r.files)||!r.files.length) process.exit(2)"
          echo "Original copy-lint completed with exit $code"

      - name: Arm the original finish gate
        working-directory: taste-native/fixtures
        shell: bash
        run: |
          set -euo pipefail
          node ../upstream/skills/taste-skill/scripts/gate.mjs --start index.html --new --kind software --category "A test software service" --primary "Try the product" --rounds 2

      - name: Execute original finish gate and its original Chrome checkers
        working-directory: taste-native/fixtures
        shell: bash
        run: |
          set +e
          set -uo pipefail
          timeout 540s node ../upstream/skills/taste-skill/scripts/gate.mjs index.html --kind software --category "A test software service" --primary "Try the product" > ../gate.log 2>&1
          code=$?
          set -e
          echo "$code" > ../gate-exit-code.txt
          tail -n 100 ../gate.log
          if [ "$code" -gt 1 ]; then
            echo "Original gate unavailable or errored: exit $code"
            exit 1
          fi
          if ! grep -Eq '^GATE: (FAIL|PASS|OPEN)\b' ../gate.log; then
            echo "No original gate verdict found"
            exit 1
          fi

      - name: Verify meaningful detection and produce structured report
        shell: bash
        run: |
          set -euo pipefail
          node taste-native/scripts/verify.mjs
          cat taste-native/native-result.json
          cat taste-native/native-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Run original Taste Skill checkers on approved public website
        shell: bash
        timeout-minutes: 7
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          target="$(node taste-native/scripts/check-target.mjs)"
          mkdir -p taste-native/live-taste
          echo "Original Taste Skill consistency quick check of approved PUBLIC URL: $target"
          set +e
          timeout 200s node taste-native/upstream/skills/taste-skill/scripts/consistency.mjs "$target" --widths 390,768 --quick --json --page software --out taste-native/live-taste > taste-native/live-consistency-stdout.json 2> taste-native/live-consistency-stderr.log
          consistency_code=$?
          set -e
          echo "$consistency_code" > taste-native/live-consistency-exit.txt
          if [ "$consistency_code" -ne 0 ] && [ "$consistency_code" -ne 1 ]; then
            cat taste-native/live-consistency-stderr.log
            echo "Original consistency CLI could not inspect the public site"
            exit 1
          fi
          test -s taste-native/live-taste/report.json
          node -e "const x=require('./taste-native/live-taste/report.json'); if(!Array.isArray(x.widths)||x.widths.length<1)process.exit(2);console.log('Original consistency checked',x.widths.length,'public page viewport(s)')"
          if [ -s taste-native/live-taste/rendered.html ]; then
            set +e
            node taste-native/upstream/skills/taste-skill/scripts/copy-lint.mjs taste-native/live-taste/rendered.html --kind software --json > taste-native/live-copy.json 2> taste-native/live-copy-stderr.log
            copy_code=$?
            set -e
            if [ "$copy_code" -ne 0 ] && [ "$copy_code" -ne 1 ]; then
              cat taste-native/live-copy-stderr.log
              echo "Original copy-lint failed on rendered public HTML"
              exit 1
            fi
            node -e "const x=require('./taste-native/live-copy.json');if(!Array.isArray(x.files)||!x.files.length)process.exit(2)"
          fi

      - name: Run original Taste Skill layout checker on approved public website
        shell: bash
        timeout-minutes: 4
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          target="$(node taste-native/scripts/check-target.mjs)"
          set +e
          timeout 150s node taste-native/upstream/skills/taste-skill/assets/layout/check.mjs --url "$target" --sizes 390x844 --json > taste-native/live-layout.json 2> taste-native/live-layout-stderr.log
          layout_code=$?
          set -e
          echo "$layout_code" > taste-native/live-layout-exit.txt
          if [ "$layout_code" -ne 0 ] && [ "$layout_code" -ne 1 ]; then
            cat taste-native/live-layout-stderr.log
            echo "Original layout checker failed to inspect the public page"
            exit 1
          fi
          node -e "const x=require('./taste-native/live-layout.json');if(!x||typeof x!=='object')process.exit(2);console.log('Original Taste Skill layout checker returned structured JSON')"

      - name: Save original gate and copy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taste-original-native-smoke
          if-no-files-found: warn
          retention-days: 7
          path: |
            taste-native/copy-lint.json
            taste-native/copy-lint.err
            taste-native/gate.log
            taste-native/gate-exit-code.txt
            taste-native/native-result.json
            taste-native/live-taste/report.json
            taste-native/live-consistency-stdout.json
            taste-native/live-consistency-stderr.log
            taste-native/live-consistency-exit.txt
            taste-native/live-copy.json
            taste-native/live-copy-stderr.log
            taste-native/live-layout.json
            taste-native/live-layout-stderr.log
            taste-native/live-layout-exit.txt

  original-impeccable-cli:
    name: Original Impeccable Rust source and CLI smoke
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMPECCABLE_PINNED_COMMIT: 687bc381bc9091bf252c0a05303640561014a425
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Checkout isolated public fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify Rust compiler and Cargo
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version

      - name: Checkout immutable original Impeccable engine source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pbakaus/impeccable.git taste-native/impeccable-upstream
          git -C taste-native/impeccable-upstream checkout --detach "$IMPECCABLE_PINNED_COMMIT"
          test "$(git -C taste-native/impeccable-upstream rev-parse HEAD)" = "$IMPECCABLE_PINNED_COMMIT"
          test -f taste-native/impeccable-upstream/Cargo.lock

      - name: Run original Rust detector tests
        working-directory: taste-native/impeccable-upstream
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p impeccable-detect

      - name: Compile original Impeccable CLI
        working-directory: taste-native/impeccable-upstream
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p impeccable
          ./target/debug/impeccable engine-probe
          ./target/debug/impeccable --version

      - name: Run native CLI detection on deliberately flawed HTML fixture
        shell: bash
        run: |
          set -euo pipefail
          set +e
          taste-native/impeccable-upstream/target/debug/impeccable detect taste-native/fixtures/index.html --json > taste-native/impeccable-detect.json 2> taste-native/impeccable-stderr.log
          code=$?
          set -e
          echo "Native CLI exit: $code"
          # Original Rust CLI contract: 0 = no primary findings, 1 = scanning failed,
          # 2 = completed successfully and found primary design issues.
          if [ "$code" -ne 2 ]; then
            echo "Expected original Impeccable CLI exit 2 for an intentionally defective fixture, observed $code"
            cat taste-native/impeccable-stderr.log
            exit 1
          fi
          node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('taste-native/impeccable-detect.json','utf8'));if(!Array.isArray(rows)||!rows.some(x=>x.severity!=='advisory'&&x.advisory!==true)){process.exit(2)};console.log('Original Rust Impeccable CLI completed and detected '+rows.length+' issues')"

      - name: Run original Impeccable CLI on approved public live website
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CI: "true"
        run: |
          set -euo pipefail
          target="$(node taste-native/scripts/check-target.mjs)"
          echo "Running original Rust CLI on approved PUBLIC URL: $target"
          set +e
          taste-native/impeccable-upstream/target/debug/impeccable detect --json "$target" > taste-native/impeccable-live.json 2> taste-native/impeccable-live-stderr.log
          code=$?
          set -e
          echo "$code" > taste-native/impeccable-live-exit.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            cat taste-native/impeccable-live-stderr.log
            echo "Original live URL scan failed operationally with exit $code"
            exit 1
          fi
          node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('taste-native/impeccable-live.json','utf8'));if(!Array.isArray(rows))process.exit(2); console.log('Original Impeccable live PUBLIC URL findings:',rows.length)"

      - name: Save original Impeccable results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: impeccable-native-cli-smoke
          if-no-files-found: warn
          retention-days: 7
          path: |
            taste-native/impeccable-detect.json
            taste-native/impeccable-stderr.log
            taste-native/impeccable-live.json
            taste-native/impeccable-live-stderr.log
            taste-native/impeccable-live-exit.txt
